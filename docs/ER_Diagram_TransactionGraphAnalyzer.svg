<svg viewBox="0 0 1900 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>ER Diagram - GPU-Accelerated Ethereum Transaction-Graph Analyzer</title>
<desc>Entity-relationship diagram with 18 entities across three layers (on-chain data, GPU analytics, forensic output) plus a central WALLET hub entity, showing primary keys, foreign keys, and relationship cardinalities.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>

<rect x="0" y="0" width="1900" height="820" fill="#ffffff"/>

<!-- Title -->
<text x="30" y="30" font-size="18" font-weight="700" fill="#111827">GPU-Accelerated Ethereum Transaction-Graph Analyzer — Entity Relationship Diagram (v2, corrected)</text>

<!-- Band backgrounds -->
<rect x="250" y="45" width="1610" height="150" rx="8" fill="#eaf1fd" stroke="#c7d9f5"/>
<text x="266" y="63" font-size="11" font-weight="700" fill="#2f6fed">LAYER 1 — ON-CHAIN DATA</text>

<rect x="250" y="215" width="1610" height="150" rx="8" fill="#e9f9ef" stroke="#c7ead4"/>
<text x="266" y="233" font-size="11" font-weight="700" fill="#1f9d55">LAYER 2 — GPU ANALYTICS</text>

