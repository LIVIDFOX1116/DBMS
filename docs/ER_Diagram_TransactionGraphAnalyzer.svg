<!-- ================= LEGEND / NOTES PANEL ================= -->
<rect x="20" y="560" width="925" height="245" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="36" y="583" font-size="12" font-weight="700" fill="#111827">Notation</text>
<text x="36" y="602" font-size="10" fill="#334155">Line = relationship. Label = verb + cardinality shown as (min,max)–(min,max), read across the line.</text>
<text x="36" y="618" font-size="10" fill="#334155"><tspan font-weight="700">PK</tspan> = primary key   <tspan font-weight="700">FK</tspan> = foreign key   <tspan font-weight="700">UK</tspan> = unique key   dashed box = new entity added in this revision</text>
<text x="36" y="634" font-size="10" fill="#334155">WALLET is the graph vertex and the busiest entity — 12 of the 30 relationships terminate there, drawn via two bus lanes to keep the diagram readable.</text>

<text x="36" y="662" font-size="12" font-weight="700" fill="#111827">Entities: 18   ·   Relationships: 30   ·   Target DBMS: PostgreSQL 15</text>

<text x="36" y="690" font-size="12" font-weight="700" fill="#b91c1c">Corrections made from the v1 design (see chat for full explanation):</text>
<text x="36" y="708" font-size="10" fill="#334155">1. Added WALLET↔TOKEN_TRANSFER (sends/receives) — v1 had the FK columns but never modelled the relationship.</text>
<text x="36" y="724" font-size="10" fill="#334155">2. Added WALLET↔SNAPSHOT_EDGE (is src of / is dst of) — same omission on the analytics side.</text>
<text x="36" y="740" font-size="10" fill="#334155">3. Renamed WALLET–TOKEN "deploys" → "is instance of": contract_wallet_id points to the contract's own WALLET row (a subtype link), not a deployer; no deployer was actually tracked.</text>
<text x="36" y="756" font-size="10" fill="#334155">4. BLOCK.miner_wallet_id renamed conceptually to proposer/fee-recipient — Ethereum has been proof-of-stake since Sept 2022, so "miner" is legacy terminology.</text>
<text x="36" y="772" font-size="10" fill="#334155">5. Introduced SNAPSHOT_EDGE_TX bridge entity: v1's SNAPSHOT_EDGE had both an aggregate weight/count AND a UNIQUE(snapshot,tx) FK to a single transaction — self-contradictory. The bridge lets one CSR edge trace back to every underlying transaction.</text>

<rect x="965" y="560" width="915" height="245" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="981" y="583" font-size="12" font-weight="700" fill="#111827">How to get a native Lucidchart / dbdiagram.io screenshot</text>
<text x="981" y="602" font-size="10" fill="#334155">This image was generated directly (no desktop access to StarUML/EdrawMax, no Lucidchart account in this session).</text>
<text x="981" y="618" font-size="10" fill="#334155">A DBML file was generated alongside this diagram — paste its contents into dbdiagram.io (free, no login) or</text>
<text x="981" y="634" font-size="10" fill="#334155">Lucidchart's "Import Data → ER Diagram" to get a screenshot from the exact named tool if your rubric requires it.</text>
<text x="981" y="660" font-size="12" font-weight="700" fill="#111827">Three-layer design rationale</text>
<text x="981" y="678" font-size="10" fill="#334155">Layer 1 mirrors the raw chain data pulled via BigQuery/Etherscan. Layer 2 records exactly which slice was</text>
<text x="981" y="694" font-size="10" fill="#334155">exported to Parquet, loaded into cuDF/cuGraph as CSR, and which algorithm ran on it — so every result is</text>
<text x="981" y="710" font-size="10" fill="#334155">reproducible. Layer 3 holds what an analyst actually works with: clusters, alerts, and rendered visualizations,</text>
<text x="981" y="726" font-size="10" fill="#334155">versioned per ANALYSIS_RUN so a Monday result and a Friday result can be compared, not overwritten.</text>
</svg>
