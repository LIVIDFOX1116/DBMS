name: Build installer

on:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-name: framecheck-installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Python deps and PyInstaller
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Build backend sidecar
        run: python scripts/build_backend_sidecar.py
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: framecheck-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          # CI's own purpose here is just "prove the installer still builds" --
          # nobody downloads this copy. The 90-day default retention let 24 of
          # these (~125 MB each, ~2.4 GB total) pile up across pushes/PRs/
          # dependabot runs until the repo's Actions storage quota was hit,
          # which failed every subsequent run's upload step -- including every
          # dependabot PR, regardless of what it changed. A real release still
          # gets its installer attached permanently by release.yml, which
          # downloads this artifact within the same run, minutes after it's
          # built -- a 1-day window is ample for that and expires long before
          # the next run's upload.
          retention-days: 1
