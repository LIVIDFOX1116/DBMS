name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    uses: ./.github/workflows/build-installer.yml

  release:
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: framecheck-installer
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
