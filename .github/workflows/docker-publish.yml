# Builds the CPU image and pushes it to a PRIVATE Docker Hub repository.
# Private on purpose: a provisional patent application is pending, so the image
# must not be publicly pullable until that is filed.
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access
# token from Docker Hub, never the account password). See README, "Deployment".
name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/framecheck:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/framecheck:${{ github.sha }}
