<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multiview — FrameCheck</title>
<style>
:root {
  --bg: #0D1614; --bg-2: #0B1A19; --panel: #101D1B; --border: #1C2E2B;
  --text: #EDF6F4; --text-2: #9DB5B0; --text-3: #6C8C87;
  --accent: #35E0C7; --frameable: #E5675A; --robust: #2FD9A8; --unaudited: #E8A63D;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-2);
}
.mv-brand { font-weight: 700; font-size: 14px; }
.mv-brand em { font-style: italic; color: var(--accent); }
#mvStatus { font-size: 12px; color: var(--text-2); }
.mv-legend { margin-left: auto; display: flex; gap: 14px; font-size: 11.5px; color: var(--text-2); }
.mv-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.mv-legend .f { background: var(--frameable); }
.mv-legend .r { background: var(--robust); }
.mv-legend .u { background: var(--unaudited); }
.mv-legend .n { background: #5C7470; }

#mvGrid {
  flex: 1; display: grid; gap: 10px; padding: 10px; min-height: 0;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
/* Fewer than 8 panels should fill the window rather than leaving holes. */
#mvGrid[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#mvGrid[data-count="2"] { grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: 1fr; }
#mvGrid[data-count="3"] { grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows: 1fr; }
#mvGrid[data-count="4"] { grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: repeat(2, minmax(0,1fr)); }
#mvGrid[data-count="5"], #mvGrid[data-count="6"] { grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows: repeat(2, minmax(0,1fr)); }

@media (max-width: 1100px) { #mvGrid { grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-rows: repeat(4, minmax(0,1fr)); } }
@media (max-width: 620px)  { #mvGrid { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: 260px; overflow-y: auto; } }

.mv-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
}
.mv-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.mv-title { font-weight: 650; font-size: 12.5px; white-space: nowrap; }
.mv-meta { display: flex; gap: 10px; font-size: 11px; color: var(--text-2); overflow: hidden; white-space: nowrap; }
.mv-expand {
  margin-left: auto; background: transparent; color: var(--text-2); cursor: pointer;
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; font-size: 12px;
}
.mv-expand:hover { color: var(--accent); border-color: var(--accent); }
.mv-canvas { position: relative; flex: 1; min-height: 0; }
.mv-canvas canvas { display: block; cursor: grab; }
.mv-canvas canvas:active { cursor: grabbing; }
.mv-status {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 11.5px; color: var(--text-3); text-align: center; padding: 14px; pointer-events: none;
}
.mv-error { color: var(--frameable); }
.mv-foot { padding: 6px 10px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-3); }

/* Expanded: one panel fills the window, the rest step out of the flow. */
#mvGrid.mv-has-expanded { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#mvGrid.mv-has-expanded .mv-panel { display: none; }
#mvGrid.mv-has-expanded .mv-panel.mv-is-expanded { display: flex; }

#mvTooltip {
  position: fixed; z-index: 50; min-width: 190px; max-width: 260px;
  background: rgba(10,22,20,.97); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 11px; font-size: 11.5px; pointer-events: none; opacity: 0;
  transition: opacity .12s ease; box-shadow: 0 8px 26px rgba(0,0,0,.45);
}
#mvTooltip.show { opacity: 1; }
.mv-tip-addr { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--text-2); margin-bottom: 6px; word-break: break-all; }
.mv-tip-row { display: flex; justify-content: space-between; gap: 12px; }
.mv-tip-row span:first-child { color: var(--text-3); }
.mv-v-frameable { color: var(--frameable); }
.mv-v-robust { color: var(--robust); }
.mv-v-unaudited { color: var(--unaudited); }
</style>
</head>
<body>
<header>
  <span class="mv-brand">Frame<em>Check</em> Multiview</span>
  <span id="mvStatus">Loading…</span>
  <span class="mv-legend">
    <span><i class="f"></i>frameable</span>
    <span><i class="r"></i>robust</span>
    <span><i class="u"></i>flagged, not audited</span>
    <span><i class="n"></i>unflagged</span>
  </span>
</header>
<main id="mvGrid"></main>
<div id="mvTooltip"></div>
<script src="graph-webgl.js"></script>
<script src="multiview.js"></script>
</body>
</html>
