[package]
name = "framecheck"
version = "0.1.0"
description = "FrameCheck desktop app: Ethereum framing audit"
authors = ["FrameCheck"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# OS keychain (Windows Credential Manager / macOS Keychain / Secret Service) --
# the Etherscan key's only storage, per the Part 2 spec: never a config file.
keyring = "3"
# Blocking client: readiness-polls the FastAPI child, hot-swaps its key via
# /internal/api-key, and makes the one-off Etherscan test-connection call --
# all straightforward synchronous request/response, no need for an async
# runtime dependency of our own here.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Per-launch random token guarding /internal/api-key (see api/main.py).
uuid = { version = "1", features = ["v4"] }
# Native compute engine (see src/layout/) -- validated by the gpu-bench
# spike: GPU wins 5x-149x over CPU on force-directed layout at >=10k nodes,
# even on integrated graphics. CPU reference path for parity tests + the
# "CPU (multi-threaded)" device choice.
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"

[target.'cfg(windows)'.dependencies]
# GPU adapter enumeration (see src/gpu.rs) -- already compiled transitively
# via tauri itself (see Cargo.lock), this just exposes the DXGI/D3D12
# feature modules we need directly instead of pulling in a second graphics
# abstraction (wgpu) that can't report VRAM figures anyway.
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    # DwmSetWindowAttribute (see lib.rs's apply_dark_titlebar): tauri.conf.json's
    # "theme": "Dark" only controls WebView2/window-chrome light-vs-dark
    # rendering, not whether Windows tints the ACTIVE window's title bar with
    # the user's own accent color -- that's a separate DWM composition
    # behavior (Settings > Personalization > Colors > "Show accent color on
    # title bars") the app theme setting doesn't touch at all. Confirmed live:
    # with a non-default Windows accent color, the focused-window title bar
    # rendered in that accent color (e.g. bright purple) against this app's
    # dark teal palette -- the exact clash the "theme": "Dark" fix was meant
    # to prevent. DWMWA_CAPTION_COLOR/DWMWA_TEXT_COLOR force a fixed color
    # instead, independent of the user's accent-color setting.
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    # Job Objects (see backend.rs's spawn_backend): ties the backend child's
    # lifetime to this process's, so a hard kill (Task Manager "End task",
    # a crash, no Drop impl runs) can't orphan it the way it could before --
    # confirmed as a real, currently-live condition on this machine (found
    # two pre-existing orphaned backend processes from earlier crashes/hard
    # kills, one of them across the whole session).
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
