[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# OS keychain (Windows Credential Manager / macOS Keychain / Secret Service) --
# the Etherscan key's only storage, per the Part 2 spec: never a config file.
keyring = "3"
# Blocking client: readiness-polls the FastAPI child, hot-swaps its key via
# /internal/api-key, and makes the one-off Etherscan test-connection call --
# all straightforward synchronous request/response, no need for an async
# runtime dependency of our own here.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Per-launch random token guarding /internal/api-key (see api/main.py).
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# GPU adapter enumeration (see src/gpu.rs) -- already compiled transitively
# via tauri itself (see Cargo.lock), this just exposes the DXGI/D3D12
# feature modules we need directly instead of pulling in a second graphics
# abstraction (wgpu) that can't report VRAM figures anyway.
windows = { version = "0.61", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Foundation",
] }
